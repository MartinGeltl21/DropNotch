name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history → commit count as CFBundleVersion

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_RC' | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build universal app, sign ad-hoc, zip
        env:
          UNIVERSAL: "1"
          SIGN_IDENTITY: "-"
        run: |
          scripts/build-app.sh --zip
          lipo -archs build/DropNotch.app/Contents/MacOS/DropNotch
          codesign --verify --deep --strict --verbose=2 build/DropNotch.app
          test -f "build/DropNotch-$VERSION.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="build/DropNotch-$VERSION.zip"
          SHA="$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
          cat > release-notes.md <<NOTES
          ## Installation

          1. Download \`DropNotch-$VERSION.zip\` and unzip it.
          2. Drag \`DropNotch.app\` into your **Applications** folder (\`/Applications\`).
          3. The app is only ad-hoc signed and **not notarized**, so on first launch
             choose **right-click → Open** (on macOS 15 and later: after the first launch attempt, click
             "Open Anyway" in *System Settings → Privacy & Security*)
             or run this in Terminal:

             \`\`\`sh
             xattr -dr com.apple.quarantine /Applications/DropNotch.app
             \`\`\`

          Requirements: macOS 14 (Sonoma) or later, Apple Silicon or Intel (universal binary).

          SHA-256 of \`DropNotch-$VERSION.zip\`: \`$SHA\`
          NOTES

          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi

          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --verify-tag \
            --title "DropNotch $VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            $PRERELEASE
